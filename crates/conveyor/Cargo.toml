[package]
name = "arcodash-conveyor"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
# schedule_spec.rs dependencies
croner = "4.0.2"
chrono-tz = "0.10"
# The scheduler's wake pub/sub holds a `redis::aio::PubSubStream`, which only implements
# `futures_core::Stream` — polling it needs a `StreamExt` impl in scope. Already resolves
# transitively (pinned via Cargo.lock), so this is a version pin, not new dependency resolution.
tokio-stream = { version = "0.1.19", default-features = false }

[dev-dependencies]
tracing-subscriber = { workspace = true }

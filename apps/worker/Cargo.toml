[package]
name = "arcodash-worker"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
arcodash-core = { path = "../../crates/shared" }
arcodash-conveyor = { path = "../../crates/conveyor" }
tokio = { workspace = true }
axum = { workspace = true }
sea-orm = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
async-trait = { workspace = true }
tokio-cron-scheduler = { workspace = true }
reqwest = { workspace = true }
lettre = { workspace = true }
# The deadline scheduler's wake pub/sub (scheduler::deadline) holds a `redis::aio::PubSubStream`,
# which only implements `futures_core::Stream` — polling it needs a `StreamExt` impl in scope.
tokio-stream = { version = "0.1.19", default-features = false }

[dev-dependencies]
arcodash-core = { path = "../../crates/shared", features = ["test-support"] }
# Inline `#[cfg(test)]` sweep tests build `ObjectStore::put` payloads directly.
bytes = { workspace = true }
